[package]
name = "airdrop-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
airdrop-core = { path = "../airdrop-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
mdns-sd = "0.11"
hex = "0.4"
